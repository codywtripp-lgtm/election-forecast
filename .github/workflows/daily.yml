name: daily
on:
  schedule:
    - cron: "15 11,23 * * *"   # 7:15am / 7:15pm ET (EDT)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        run: |
          python -m pipeline.ingest.votehub
          python -m pipeline.ingest.wikipedia
      - name: Normalize
        run: |
          python -m pipeline.races
          python -m pipeline.normalize.results
          python -m pipeline.normalize.polls
          python -m pipeline.composition
      - name: Validate
        run: python -m pytest -q
      - name: Forecast
        run: python -m pipeline.run --sims 50000
      - name: Commit data, history and run manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data runs
          git diff --cached --quiet || git commit -m "Forecast $(date -u +%F\ %H:%M) UTC"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/static/data
