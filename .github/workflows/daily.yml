name: daily
on:
  schedule:
    - cron: "15 11,23 * * *"   # 7:15am / 7:15pm ET (EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        run: |
          python -m pipeline.ingest.votehub
          python -m pipeline.ingest.wikipedia
      - name: Normalize
        run: |
          python -m pipeline.races
          python -m pipeline.normalize.polls
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
