name: forecast
on:
  schedule:
    - cron: "15 11,23 * * *"   # 7:15am / 7:15pm ET (EDT)
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "data/manual/**", "data/model/**", "docs/**", ".github/workflows/daily.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        run: |
          python -m pipeline.ingest.votehub
          python -m pipeline.ingest.wikipedia
      - name: Normalize
        run: |
          python -m pipeline.races
          python -m pipeline.house
          python -m pipeline.normalize.results
          python -m pipeline.normalize.polls
          python -m pipeline.fec
          python -m pipeline.composition
          python -m pipeline.expert
          python -m pipeline.specials
      - name: Validate
        run: python -m pytest -q
      - name: Forecast
        run: |
          python -m pipeline.run --sims 50000
          python -m pipeline.trackers
      - name: Commit data, history and run manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data runs
          git diff --cached --quiet || git commit -m "Forecast $(date -u '+%F %H:%M') UTC"
          git pull --rebase
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
          touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
