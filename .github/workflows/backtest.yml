name: backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"        # Mondays: refit error structure on the backtest
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python -m pipeline.races
          python -m pipeline.house
          python -m pipeline.normalize.results
          python -m pipeline.normalize.polls
          python -m pipeline.fec
          python -m pipeline.backtest.replay
          python -m pipeline.backtest.calibrate
          python -m pipeline.composition
          python -m pipeline.sensitivity
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model
          git diff --cached --quiet || git commit -m "Backtest recalibration $(date -u +%F)"
          git pull --rebase
          git push
